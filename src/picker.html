<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Ne paylaşmak istiyorsun?</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0b0e13; color: #e8e4d8;
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
    }
    header { padding: 14px 18px 10px; }
    h1 { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: #e8a33d; margin: 0 0 4px; }
    p { font-size: 12px; color: #9aa3ad; margin: 0; }
    main { flex: 1; overflow-y: auto; padding: 4px 18px 14px; }
    .label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #c9a45c; margin: 12px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .card {
      border: 1px solid #2b3644; border-radius: 8px; background: #10151c;
      padding: 8px; cursor: pointer; text-align: center;
      transition: border-color .12s;
    }
    .card:hover, .card:focus { border-color: #e8a33d; outline: none; }
    .card img { width: 100%; height: 112px; object-fit: contain; border-radius: 4px; background: #0b0e13; }
    .card .name {
      font-size: 11px; color: #e8e4d8; margin-top: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    footer { padding: 10px 18px; border-top: 1px solid #202935; text-align: right; }
    button {
      padding: 8px 16px; border: 0; border-radius: 6px; background: #161d27;
      color: #e8e4d8; font-size: 13px; cursor: pointer;
    }
    button:hover { background: #202935; }
    .empty { color: #9aa3ad; font-size: 13px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Ekran paylaşımı</h1>
    <p>Paylaşmak istediğin ekranı veya pencereyi seç.</p>
  </header>
  <main id="list"><div class="empty">kaynaklar listeleniyor…</div></main>
  <footer><button id="cancel">Vazgeç</button></footer>
  <script>
    const list = document.getElementById('list');
    const render = (sources) => {
      list.innerHTML = '';
      if (!sources.length) {
        list.innerHTML = '<div class="empty">paylaşılabilir kaynak yok</div>';
        return;
      }
      const section = (title, items) => {
        if (!items.length) return;
        const h = document.createElement('div');
        h.className = 'label';
        h.textContent = title;
        list.appendChild(h);
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const s of items) {
          const card = document.createElement('div');
          card.className = 'card';
          card.tabIndex = 0;
          const img = document.createElement('img');
          img.alt = '';
          img.src = s.thumb;
          card.appendChild(img);
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = s.name || s.id;
          card.appendChild(name);
          const go = () => window.postacim.pick(s.id);
          card.onclick = go;
          card.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') go(); };
          grid.appendChild(card);
        }
        list.appendChild(grid);
      };
      section('Ekranlar', sources.filter((s) => s.kind === 'screen'));
      section('Pencereler', sources.filter((s) => s.kind === 'window'));
    };
    window.postacim.onSources(render);
    document.getElementById('cancel').onclick = () => window.postacim.cancelShare();
  </script>
</body>
</html>
