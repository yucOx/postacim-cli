name: desktop-release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
      # Release yükleme yalnız tag push'ta; workflow_dispatch'te artifact yeterli.
      # Üç job paralel koşar: release'i ilk bitiren oluşturur, diğerleri var olana yükler.
      - name: Release'a yükle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml --title "$GITHUB_REF_NAME" \
            || gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
      - name: Release'a yükle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest*.yml --title "$GITHUB_REF_NAME" \
            || gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest*.yml --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64-arm64
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
      - name: Release'a yükle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.blockmap dist/latest*.yml --title "$GITHUB_REF_NAME" \
            || gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.blockmap dist/latest*.yml --clobber
